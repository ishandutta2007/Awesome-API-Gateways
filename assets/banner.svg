<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Glow Backgrounds -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad)" filter="url(#softGlow)" />
  <circle cx="1000" cy="300" r="220" fill="url(#glowGrad)" filter="url(#softGlow)" />

  <!-- Decorative Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Glowing Abstract Network Nodes & Gateway Pipelines -->
  <g stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <path d="M 120,140 L 240,90 L 360,170 L 220,290 Z" />
    <path d="M 960,110 L 1080,210 L 920,310 L 860,170 Z" />
    <path d="M 480,70 L 720,70 L 600,160 Z" stroke-dasharray="6,6" />
    <!-- Dynamic Traffic routing paths -->
    <path d="M 0,200 Q 300,120 600,200 T 1200,200" stroke-width="2" stroke-opacity="0.2" />
  </g>

  <!-- Glowing Nodes/Vertices -->
  <g fill="url(#primaryGrad)" filter="url(#glow)">
    <circle cx="120" cy="140" r="6" />
    <circle cx="240" cy="90" r="5" />
    <circle cx="360" cy="170" r="6" />
    <circle cx="220" cy="290" r="7" />
    <circle cx="960" cy="110" r="5" />
    <circle cx="1080" cy="210" r="7" />
    <circle cx="920" cy="310" r="5" />
    <circle cx="860" cy="170" r="6" />
    <circle cx="480" cy="70" r="5" />
    <circle cx="720" cy="70" r="5" />
  </g>

  <!-- Central Content -->
  <g transform="translate(600, 200)" text-anchor="middle">
    <!-- Title Glow -->
    <text y="-20" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" fill="url(#primaryGrad)" filter="url(#glow)" letter-spacing="3">AWESOME API GATEWAYS</text>
    <!-- Title Main -->
    <text y="-20" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="3">AWESOME API GATEWAYS</text>

    <!-- Subtitle -->
    <text y="45" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#9ca3af" letter-spacing="2">CURATED LIST OF API GATEWAYS, INGRESS CONTROLLERS &amp; REVERSE PROXIES</text>

    <!-- Keywords Pill Tagline -->
    <text y="80" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#38bdf8" letter-spacing="1.5">TRAFFIC MANAGEMENT &bull; CLOUD-NATIVE INGRESS &bull; API LIFECYCLE GOVERNANCE</text>

    <!-- Decorative Border/Line below title -->
    <rect x="-260" y="105" width="520" height="4" rx="2" fill="url(#primaryGrad)" filter="url(#glow)" />
  </g>

  <!-- Floating Tech Symbols / Ingress Routing Visuals -->
  <!-- Left Ingress Bracket < / > -->
  <path d="M 80,180 L 50,200 L 80,220" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  <path d="M 1120,180 L 1150,200 L 1120,220" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  <path d="M 95,170 L 75,230 M 1105,170 L 1085,230" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
