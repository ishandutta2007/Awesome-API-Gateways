<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="stream-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-bg { opacity: 0.7; }
    
    /* Traffic Stream Animations */
    .stream-line {
      stroke-dasharray: 12 180;
      animation: trafficFlow 6s linear infinite;
    }
    .stream-line-fast {
      stroke-dasharray: 20 220;
      animation: trafficFlow 4s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 16 160;
      animation: trafficFlowRev 5s linear infinite;
    }

    /* Pulse Node Animations */
    .pulse-dot {
      animation: nodePulse 2.5s ease-in-out infinite alternate;
    }
    .pulse-dot-delayed {
      animation: nodePulse 3s ease-in-out 1.2s infinite alternate;
    }

    /* Gateway Core Glow */
    .gateway-core {
      animation: coreGlow 4s ease-in-out infinite alternate;
    }

    @keyframes trafficFlow {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes trafficFlowRev {
      from { stroke-dashoffset: -600; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0% { r: 4px; opacity: 0.4; }
      100% { r: 7px; opacity: 0.95; }
    }
    @keyframes coreGlow {
      0% { opacity: 0.3; filter: drop-shadow(0 0 4px #38bdf8); }
      100% { opacity: 0.75; filter: drop-shadow(0 0 16px #818cf8); }
    }

    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#cyber-grid)" class="grid-bg" rx="16" />

  <!-- Ambient Light Orbs (Background depth) -->
  <circle cx="150" cy="80" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#7c3aed" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="30" r="100" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- DYNAMIC / ANIMATED ELEMENTS (Constrained to sides & lower circuit layer so titles stay clean) -->
  <g opacity="0.85">
    <!-- Traffic Circuit Curves: Left to Gateway -->
    <path d="M -20 70 C 180 70, 220 140, 360 140" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M -20 70 C 180 70, 220 140, 360 140" fill="none" stroke="#38bdf8" stroke-width="2.5" class="stream-line" filter="url(#soft-glow)" />

    <path d="M -20 290 C 160 290, 200 220, 360 220" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M -20 290 C 160 290, 200 220, 360 220" fill="none" stroke="#818cf8" stroke-width="2.5" class="stream-line-fast" filter="url(#soft-glow)" />

    <!-- Traffic Circuit Curves: Right from Gateway to Backends -->
    <path d="M 840 140 C 980 140, 1020 70, 1220 70" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 840 140 C 980 140, 1020 70, 1220 70" fill="none" stroke="#c084fc" stroke-width="2.5" class="stream-line" filter="url(#soft-glow)" />

    <path d="M 840 220 C 980 220, 1040 290, 1220 290" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 840 220 C 980 220, 1040 290, 1220 290" fill="none" stroke="#38bdf8" stroke-width="2.5" class="stream-line-rev" filter="url(#soft-glow)" />

    <!-- Central Routing Gateway Geometric Core Accent (Subtle, behind text) -->
    <rect x="520" y="275" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" class="gateway-core" />
    <circle cx="540" cy="293" r="5" fill="#38bdf8" class="pulse-dot" />
    <circle cx="600" cy="293" r="5" fill="#818cf8" class="pulse-dot-delayed" />
    <circle cx="660" cy="293" r="5" fill="#c084fc" class="pulse-dot" />
    <text x="600" y="325" fill="#64748b" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" letter-spacing="1.5">ROUTING ENGINE</text>

    <!-- Side Microservice / Gateway Nodes -->
    <circle cx="200" cy="70" r="5" fill="#38bdf8" class="pulse-dot" />
    <circle cx="180" cy="290" r="5" fill="#818cf8" class="pulse-dot-delayed" />
    <circle cx="1020" cy="70" r="5" fill="#c084fc" class="pulse-dot" />
    <circle cx="1040" cy="290" r="5" fill="#38bdf8" class="pulse-dot-delayed" />
  </g>

  <!-- FOREGROUND METADATA PILLS -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <!-- Pill 1: Ecosystem -->
    <g transform="translate(-150, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <text y="4" fill="#38bdf8" class="badge-pill" text-anchor="middle">⚡ HIGH SPEED L7</text>
    </g>
    <!-- Pill 2: Scope -->
    <g transform="translate(0, 0)">
      <rect x="-75" y="-12" width="150" height="24" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
      <text y="4" fill="#a5b4fc" class="badge-pill" text-anchor="middle">🛡️ SECURITY &amp; INGRESS</text>
    </g>
    <!-- Pill 3: OSS + Cloud -->
    <g transform="translate(150, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
      <text y="4" fill="#e9d5ff" class="badge-pill" text-anchor="middle">🌐 SAAS &amp; OPEN-SOURCE</text>
    </g>
  </g>

  <!-- FOREGROUND MAIN TITLE & BRANDING (Crisp, High Contrast, Centered) -->
  <g text-anchor="middle">
    <!-- Main Glowing Title -->
    <text x="600" y="142" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" 
          font-weight="800" 
          fill="url(#primary-glow)" 
          letter-spacing="-0.5"
          filter="url(#soft-glow)">
      Awesome API Gateways
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="185" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="18" 
          font-weight="500" 
          fill="#cbd5e1" 
          letter-spacing="0.2">
      Curated Landscape of API Gateways, Ingress Controllers &amp; Traffic Management
    </text>

    <!-- Technology Keywords Footnote -->
    <text x="600" y="222" 
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
          font-size="13" 
          font-weight="500" 
          fill="#94a3b8">
      Traefik &bull; Kong &bull; Apache APISIX &bull; Envoy &bull; Tyk &bull; KrakenD &bull; HAProxy &bull; Apigee
    </text>
  </g>
</svg>
